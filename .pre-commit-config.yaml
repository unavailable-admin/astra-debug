repos:
  - repo: local
    hooks:
      - id: black
        name: Black (Python 3.10, 120 columns)
        entry: python3 -m black --check --target-version py310 --line-length 120
        language: system
        types: [python]
      - id: ruff
        name: Ruff
        entry: python3 -m ruff check
        language: system
        types: [python]
      - id: shell-syntax
        name: Bash syntax
        entry: bash -c 'for file in "$@"; do bash -n "$file" || exit; done' --
        language: system
        types: [shell]
        require_serial: true
